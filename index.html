<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f14">
  <title>PinDrop</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- ══ MAP VIEW ═══════════════════════════════════════════════ -->
<div id="map-view" class="view active">

  <div id="map"></div>

  <!-- Top bar -->
  <div id="topbar">
    <div id="hint-pill" class="pill">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
      Tap the map to drop a pin
    </div>

    <div id="radius-pill" class="pill" onclick="toggleRadius(event)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/></svg>
      <span id="radius-label">1 km</span>
      <div id="radius-menu">
        <div class="radius-opt" data-m="250" onclick="setRadius(250)">250 m</div>
        <div class="radius-opt" data-m="500" onclick="setRadius(500)">500 m</div>
        <div class="radius-opt active" data-m="1000" onclick="setRadius(1000)">1 km</div>
        <div class="radius-opt" data-m="2000" onclick="setRadius(2000)">2 km</div>
        <div class="radius-opt" data-m="5000" onclick="setRadius(5000)">5 km</div>
        <div class="radius-opt" data-m="10000" onclick="setRadius(10000)">10 km</div>
        <div class="radius-opt" data-m="20000" onclick="setRadius(20000)">20 km</div>
        <div class="radius-opt" data-m="50000" onclick="setRadius(50000)">50 km</div>
      </div>
    </div>

    <div id="loc-btn" class="pill" onclick="goToLocation()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm9.94 3A9.99 9.99 0 0013 2.06V0h-2v2.06A9.99 9.99 0 002.06 11H0v2h2.06A9.99 9.99 0 0011 21.94V24h2v-2.06A9.99 9.99 0 0021.94 13H24v-2h-2.06z"/></svg>
    </div>

    <div id="clear-btn" class="pill" onclick="clearPin()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>
  </div>

  <!-- Trip planner button -->
  <div id="trip-planner-btn" onclick="openTripPlanner()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12h18M13 6l6 6-6 6"/></svg>
    Trip Planner
  </div>

  <!-- Bottom sheet -->
  <div id="sheet">
    <div id="drag-handle"></div>
    <div id="cat-row"></div>
    <div id="results-header"></div>
    <div id="results">
      <div class="state-card">
        <div class="icon">📍</div>
        <div>Tap anywhere on the map<br>to find nearby places</div>
      </div>
    </div>
  </div>

  <!-- Detail overlay -->
  <div id="detail" onclick="closeDetail(event)">
    <div id="detail-card">
      <div id="detail-handle"></div>
      <div id="detail-header">
        <div id="detail-icon-wrap"></div>
        <div>
          <div id="detail-name"></div>
          <div id="detail-cat"></div>
        </div>
      </div>
      <div id="detail-rating-block"></div>
      <div id="detail-rows"></div>
      <div id="detail-actions">
        <button id="detail-map-btn" class="detail-action-btn" onclick="openInMaps()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Open in Maps
        </button>
        <button id="detail-directions-btn" class="detail-action-btn" onclick="openTransportForDetail()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12h18M13 6l6 6-6 6"/></svg>
          Directions
        </button>
      </div>
    </div>
  </div>

</div><!-- /map-view -->

<!-- ══ TRANSPORT VIEW ════════════════════════════════════════ -->
<div id="transport-view" class="view">

  <div id="transport-header">
    <div class="transport-back-row">
      <div id="transport-back-btn" onclick="showMapView()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Back
      </div>
      <div style="flex:1"></div>
      <div id="trip-swap-btn" onclick="swapTrip()" style="font-size:18px;cursor:pointer;padding:4px 8px;-webkit-tap-highlight-color:transparent" title="Swap origin & destination">⇅</div>
    </div>

    <!-- From field -->
    <div class="trip-field-wrap">
      <div class="trip-field-label">FROM</div>
      <div class="trip-input-row">
        <span class="trip-field-icon">🟢</span>
        <input id="trip-origin-input" class="trip-input" type="text" placeholder="City, place or 'My Location'" autocomplete="off" spellcheck="false" oninput="onTripInput('origin')" onfocus="onTripFocus('origin')">
        <button class="trip-input-clear" id="trip-origin-clear" onclick="clearTripField('origin')">✕</button>
      </div>
      <div class="trip-suggestions" id="trip-origin-suggestions"></div>
    </div>

    <!-- To field -->
    <div class="trip-field-wrap" style="margin-top:8px">
      <div class="trip-field-label">TO</div>
      <div class="trip-input-row">
        <span class="trip-field-icon">🔴</span>
        <input id="trip-dest-input" class="trip-input" type="text" placeholder="City or destination" autocomplete="off" spellcheck="false" oninput="onTripInput('dest')" onfocus="onTripFocus('dest')">
        <button class="trip-input-clear" id="trip-dest-clear" onclick="clearTripField('dest')">✕</button>
      </div>
      <div class="trip-suggestions" id="trip-dest-suggestions"></div>
    </div>
  </div>

  <!-- Mode tabs -->
  <div id="mode-tabs">
    <div class="mode-tab active" data-mode="all" onclick="selectMode('all')">
      <div class="mode-tab-icon">🗺️</div>
      All
    </div>
    <div class="mode-tab" data-mode="walk" onclick="selectMode('walk')">
      <div class="mode-tab-icon">🚶</div>
      Walk
    </div>
    <div class="mode-tab" data-mode="cycle" onclick="selectMode('cycle')">
      <div class="mode-tab-icon">🚲</div>
      Cycle
    </div>
    <div class="mode-tab" data-mode="drive" onclick="selectMode('drive')">
      <div class="mode-tab-icon">🚗</div>
      Drive
    </div>
    <div class="mode-tab" data-mode="transit" onclick="selectMode('transit')">
      <div class="mode-tab-icon">🚌</div>
      Transit
    </div>
    <div class="mode-tab" data-mode="fly" onclick="selectMode('fly')">
      <div class="mode-tab-icon">✈️</div>
      Fly
    </div>
  </div>

  <div id="transport-cards">
    <div class="transport-state">
      <div class="icon">📍</div>
      <div>Set your origin to see directions</div>
    </div>
  </div>

</div><!-- /transport-view -->

<!-- ══ DATE PICKER PAGE ═════════════════════════════════════════ -->
<div id="date-picker-overlay" onclick="closeDatePickerPage(event)">
  <div id="date-picker-card">
    <div id="date-picker-handle"></div>
    <div id="date-picker-header">
      <div id="date-picker-title">Select travel date</div>
      <div id="date-picker-close" onclick="closeDatePickerPage(event)">✕</div>
    </div>
    <div id="date-picker-quick"></div>
    <div id="date-picker-cal"></div>
  </div>
</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/map.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/flights.js"></script>
  <script src="js/transport.js"></script>
</body>
</html>
