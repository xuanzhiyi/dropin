<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f14">
  <title>PinDrop</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f14;
      --surface:   #1a1a24;
      --surface2:  #23232f;
      --surface3:  #2c2c3c;
      --border:    rgba(255,255,255,0.08);
      --text:      #f0f0f5;
      --muted:     rgba(240,240,245,0.45);
      --accent:    #7c6af7;
      --accent-lo: rgba(124,106,247,0.15);
      --radius:    14px;
      --sheet-h:   52vh;
      --safe-b:    env(safe-area-inset-bottom, 0px);
      --safe-t:    env(safe-area-inset-top, 44px);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
    }

    /* ── Views ───────────────────────────────────────────────── */
    .view { position: fixed; inset: 0; display: none; }
    .view.active { display: block; }

    /* ── Map ─────────────────────────────────────────────────── */
    #map {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .leaflet-tile { filter: brightness(0.82) saturate(0.7) hue-rotate(190deg); }
    .leaflet-container { background: #0f0f14; }

    /* ── Top bar ─────────────────────────────────────────────── */
    #topbar {
      position: fixed;
      top: var(--safe-t);
      left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      pointer-events: none;
    }

    .pill {
      pointer-events: all;
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      background: rgba(26,26,36,0.88);
      border: 1px solid var(--border);
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 15px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .pill:active { background: rgba(40,40,56,0.95); }
    .pill svg { flex-shrink: 0; }

    #hint-pill { flex: 1; justify-content: center; color: var(--muted); }
    #hint-pill.hidden { display: none; }

    #loc-btn { padding: 9px 13px; }
    #clear-btn { padding: 9px 13px; display: none; }
    #clear-btn.show { display: flex; }

    /* ── Radius badge ────────────────────────────────────────── */
    #radius-pill { position: relative; }
    #radius-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      background: rgba(26,26,36,0.96);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      min-width: 160px;
      z-index: 20;
    }
    #radius-menu.open { display: block; }
    .radius-opt {
      padding: 13px 18px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }
    .radius-opt:last-child { border-bottom: none; }
    .radius-opt:active { background: var(--surface2); }
    .radius-opt.active { color: var(--accent); }
    .radius-opt.active::after { content: "✓"; font-weight: 700; }

    /* ── Bottom sheet ────────────────────────────────────────── */
    #sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      height: var(--sheet-h);
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      border-top: 1px solid var(--border);
      transform: translateY(calc(var(--sheet-h) - 80px - var(--safe-b)));
      transition: transform 0.38s cubic-bezier(0.32,0.72,0,1);
      will-change: transform;
      touch-action: none;
    }
    #sheet.expanded { transform: translateY(0); }

    #drag-handle {
      width: 36px; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin: 10px auto 0;
      flex-shrink: 0;
    }

    #cat-row {
      display: flex;
      gap: 8px;
      padding: 10px 14px 8px;
      overflow-x: auto;
      overflow-y: hidden;
      flex-shrink: 0;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    #cat-row::-webkit-scrollbar { display: none; }

    .cat-chip {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 100px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      background: var(--surface2);
      border: 1.5px solid transparent;
      color: var(--muted);
      -webkit-tap-highlight-color: transparent;
      transition: all 0.18s;
    }
    .cat-chip.active {
      color: #fff;
      border-color: var(--chip-color, var(--accent));
      background: color-mix(in srgb, var(--chip-color, var(--accent)) 18%, transparent);
    }
    .cat-icon { font-size: 14px; }

    #results-header {
      padding: 4px 16px 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    #results {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 0 12px;
      padding-bottom: calc(12px + var(--safe-b));
    }
    #results::-webkit-scrollbar { display: none; }

    .state-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 120px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 0 24px;
    }
    .state-card .icon { font-size: 32px; opacity: 0.5; }

    .spinner {
      width: 28px; height: 28px;
      border: 2.5px solid rgba(124,106,247,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Place card ──────────────────────────────────────────── */
    .place-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: var(--radius);
      margin-bottom: 8px;
      background: var(--surface2);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.12s;
      border: 1px solid transparent;
    }
    .place-card:active { background: var(--surface3); }

    .place-icon-wrap {
      width: 42px; height: 42px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .place-info { flex: 1; min-width: 0; }
    .place-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .place-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Rating stars inline */
    .place-rating {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-top: 4px;
    }
    .stars {
      display: flex;
      gap: 1px;
    }
    .star {
      font-size: 10px;
      line-height: 1;
    }
    .rating-val {
      font-size: 11px;
      font-weight: 700;
      color: #f5c842;
    }
    .rating-count {
      font-size: 10px;
      color: var(--muted);
    }

    .place-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .place-dist {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }
    .place-directions-btn {
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-lo);
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .place-directions-btn:active { opacity: 0.7; }

    /* ── Detail panel ────────────────────────────────────────── */
    #detail {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: flex-end;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    #detail.open { display: flex; }

    #detail-card {
      width: 100%;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      padding-bottom: calc(24px + var(--safe-b));
      max-height: 75vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.36s cubic-bezier(0.32,0.72,0,1);
    }
    #detail.open #detail-card { transform: translateY(0); }

    #detail-handle {
      width: 36px; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    #detail-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }
    #detail-icon-wrap {
      width: 54px; height: 54px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    #detail-name { font-size: 17px; font-weight: 700; line-height: 1.3; }
    #detail-cat  { font-size: 12px; font-weight: 600; margin-top: 3px; }

    /* Detail rating block */
    #detail-rating-block {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .detail-rating-score {
      font-size: 32px;
      font-weight: 800;
      color: #f5c842;
      line-height: 1;
    }
    .detail-rating-right { display: flex; flex-direction: column; gap: 4px; }
    .detail-stars-row { display: flex; gap: 2px; }
    .detail-star { font-size: 15px; }
    .detail-rating-count { font-size: 12px; color: var(--muted); }

    .detail-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .row-icon { font-size: 16px; width: 24px; text-align: center; flex-shrink: 0; }
    .detail-row a { color: var(--accent); text-decoration: none; }

    /* ── Place vibe description ─────────────────────────────── */
    #detail-vibe {
      margin: 12px 0 4px;
      padding: 12px 14px;
      background: var(--surface2);
      border-radius: 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
    }
    #detail-vibe strong { color: var(--text); }

    /* ── Comments section ────────────────────────────────────── */
    #detail-comments {
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .comments-heading {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .comment-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .comment-item:last-of-type { border-bottom: none; }
    .comment-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .comment-author {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }
    .comment-date {
      font-size: 11px;
      color: var(--muted);
    }
    .comment-text {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
    }
    .comment-delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .comment-delete-btn:active { color: #E53935; }
    .no-comments-msg {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      padding: 10px 0 14px;
    }
    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .comment-input {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      padding: 10px 12px;
      resize: none;
      outline: none;
      min-height: 72px;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    .comment-input:focus { border-color: var(--accent); }
    .comment-input::placeholder { color: var(--muted); }
    .comment-submit-btn {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .comment-submit-btn:active { opacity: 0.8; }

    /* ── Detail action buttons ───────────────────────────────── */
    #detail-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .detail-action-btn {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.01em;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .detail-action-btn:active { opacity: 0.8; }
    #detail-map-btn {
      background: var(--accent);
      color: #fff;
    }
    #detail-directions-btn {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* ── Custom pin marker ───────────────────────────────────── */
    .dropped-pin {
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 24px solid var(--accent);
      position: relative;
      filter: drop-shadow(0 4px 8px rgba(124,106,247,0.5));
    }
    .dropped-pin::before {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      background: #fff;
      border-radius: 50%;
      top: -20px;
      left: -6px;
    }

    .poi-dot {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .leaflet-control-attribution {
      background: rgba(0,0,0,0.5) !important;
      color: rgba(255,255,255,0.4) !important;
      font-size: 9px !important;
    }
    .leaflet-control-attribution a { color: rgba(255,255,255,0.5) !important; }

    /* ════════════════════════════════════════════════════════════
       TRANSPORT VIEW
    ════════════════════════════════════════════════════════════ */
    #transport-view {
      background: var(--bg);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 40;
    }

    #transport-header {
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      background: rgba(15,15,20,0.9);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-t) + 4px) 16px 14px;
    }

    .transport-back-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    #transport-back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      padding: 4px 0;
    }

    .transport-route-summary {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .route-endpoint {
      flex: 1;
      min-width: 0;
    }
    .route-endpoint-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .route-endpoint-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .route-arrow {
      color: var(--muted);
      font-size: 18px;
      flex-shrink: 0;
    }

    /* Origin selector */
    #origin-selector {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #origin-selector::-webkit-scrollbar { display: none; }

    .origin-chip {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 100px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      background: var(--surface2);
      border: 1.5px solid transparent;
      color: var(--muted);
      -webkit-tap-highlight-color: transparent;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .origin-chip.active {
      color: #fff;
      border-color: var(--accent);
      background: var(--accent-lo);
    }

    /* Transport mode tabs */
    #mode-tabs {
      display: flex;
      gap: 0;
      padding: 14px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
    }
    #mode-tabs::-webkit-scrollbar { display: none; }

    .mode-tab {
      flex: 1;
      min-width: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 9px 6px;
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.18s;
      border: 1.5px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }
    .mode-tab.active {
      background: var(--accent-lo);
      border-color: var(--accent);
      color: var(--accent);
    }
    .mode-tab-icon { font-size: 20px; line-height: 1; }

    /* Transport cards */
    #transport-cards {
      padding: 16px 16px;
      padding-bottom: calc(24px + var(--safe-b));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .transport-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .transport-card.best {
      border-color: var(--accent);
    }

    .transport-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
    }
    .transport-mode-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .transport-card-info { flex: 1; }
    .transport-card-title {
      font-size: 15px;
      font-weight: 700;
    }
    .transport-card-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .transport-card-time {
      text-align: right;
    }
    .transport-time-val {
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
    }
    .transport-time-unit {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Best badge */
    .best-badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--accent);
      color: #fff;
      border-radius: 4px;
      padding: 2px 6px;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* Steps breakdown */
    .transport-steps {
      border-top: 1px solid var(--border);
      padding: 0 16px;
    }
    .transport-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .transport-step:last-child { border-bottom: none; }
    .step-icon { font-size: 15px; width: 22px; text-align: center; flex-shrink: 0; margin-top: 1px; }

<body>

</div><!-- /map-view -->

<!-- ══ TRANSPORT VIEW ════════════════════════════════════════ -->
<div id="transport-view" class="view">

    </div>

</div><!-- /transport-view -->

<script>
/**
 * PinDrop — a single-file mobile-first "drop a pin and explore nearby" app.
 *
 * Architecture:
 *   - Map view   : Leaflet map + bottom sheet results + detail overlay
 *   - Transport  : directions screen rendered from estimated travel times
 *
 * Data sources:
 *   - Places     : OpenStreetMap via Overpass API (3 mirror endpoints)
 *   - Ratings    : synthetic — deterministically seeded from OSM node id
 *   - Directions : formula-based estimates (not real routing); deep-links
 *                  hand off to Apple Maps / Google Maps for turn-by-turn
 *   - Flights    : nearest airport lookup from a curated static list;
 *                  prices are synthetic estimates, booking links go to
 *                  Skyscanner and Google Flights
 */

// ════════════════════════════════════════════════════════════
// CATEGORIES
// Each entry maps a UI label to the OSM tag key/value used in
// the Overpass query. `tags` always has exactly one key–value
// pair; the first entry is selected by default on load.
// ════════════════════════════════════════════════════════════
const CATS = [
  { id:'restaurant',  label:'Restaurants', icon:'🍽️', color:'#F05B5B', tags: {amenity:'restaurant'} },
  { id:'cafe',        label:'Cafés',       icon:'☕', color:'#C8844A', tags: {amenity:'cafe'} },
  { id:'hotel',       label:'Hotels',      icon:'🏨', color:'#5B6BF0', tags: {tourism:'hotel'} },
  { id:'bar',         label:'Bars',        icon:'🍻', color:'#9B5BF0', tags: {amenity:'bar'} },
  { id:'fast_food',   label:'Fast Food',   icon:'🍔', color:'#F0A55B', tags: {amenity:'fast_food'} },
  { id:'supermarket', label:'Groceries',   icon:'🛒', color:'#4CAF50', tags: {shop:'supermarket'} },
  { id:'park',        label:'Parks',       icon:'🌳', color:'#2E8B57', tags: {leisure:'park'} },
  { id:'museum',      label:'Museums',     icon:'🏛️', color:'#607D8B', tags: {tourism:'museum'} },
  { id:'pharmacy',    label:'Pharmacy',    icon:'💊', color:'#00ACC1', tags: {amenity:'pharmacy'} },
  { id:'hospital',    label:'Hospital',    icon:'🏥', color:'#E53935', tags: {amenity:'hospital'} },
  { id:'fuel',        label:'Gas',         icon:'⛽', color:'#FF7043', tags: {amenity:'fuel'} },
  { id:'gym',         label:'Gym',         icon:'🏋️', color:'#8D6E63', tags: {leisure:'fitness_centre'} },
];

// ════════════════════════════════════════════════════════════
// STATE
// All mutable state lives here at module scope (single-file
// app — no framework, no module system).
// ════════════════════════════════════════════════════════════

// Map layer references
let map;           // Leaflet map instance
let pinMarker;     // the dropped-pin marker (only one at a time)
let poiMarkers = []; // POI dot markers for the current search result

// Search state
let activeCat = CATS[0]; // currently selected category chip
let radiusM   = 1000;    // search radius in metres
let pinLat = null, pinLng = null; // coordinates of the dropped pin (null = no pin)
let currentPlaces = [];  // last Overpass result, used by transport deep-links
let currentDetail = null; // { place, cat } shown in the detail overlay

// Bottom sheet
let sheetExpanded = false;

// Transport view state
let transportDest       = null; // { lat, lng, name } — destination being routed to
let transportOriginMode = 'gps';  // 'gps' | 'pin'
let transportActiveMode = 'all';  // 'all' | 'walk' | 'cycle' | 'drive' | 'transit' | 'fly'
let userLat = null, userLng = null; // most-recently-acquired GPS position

// Rating cache: osm_id → { score, count }
// Populated lazily by syntheticRating(); persists for the page lifetime
// so the same place always shows the same score.
let ratingCache = {};

// ════════════════════════════════════════════════════════════
// VIEW SWITCHING
// The app has two full-screen views. Only the active one is
// visible (CSS .view.active { display: block }).
// ════════════════════════════════════════════════════════════

/**
 * Switch to the map view. Calls map.invalidateSize() after a
 * brief delay because Leaflet needs the container to be visible
 * before it can recalculate tile positions.
 */
function showMapView() {
  document.getElementById('map-view').classList.add('active');
  document.getElementById('transport-view').classList.remove('active');
  setTimeout(() => map.invalidateSize(), 50);
}

/** Switch to the transport/directions view. */
function showTransportView() {
  document.getElementById('map-view').classList.remove('active');
  document.getElementById('transport-view').classList.add('active');
}

// ════════════════════════════════════════════════════════════
// MAP INIT
// Default centre: New York City. zoomControl disabled because
// the custom top-bar pills replace it visually. tap:true
// enables click events on iOS Safari (Leaflet quirk).
// ════════════════════════════════════════════════════════════
map = L.map('map', {
  zoomControl: false,
  attributionControl: true,
  tap: true,
}).setView([40.7128, -74.006], 14);

// OpenStreetMap standard tile layer. The CSS filter on
// .leaflet-tile (brightness/saturate/hue-rotate) gives it
// the dark-mode look without a paid tile provider.
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors',
  maxZoom: 19,
}).addTo(map);

// Any tap/click on the map drops or moves the pin.
map.on('click', e => dropPin(e.latlng.lat, e.latlng.lng));

// ════════════════════════════════════════════════════════════
// CATEGORY CHIPS
// Built dynamically from CATS so adding a new category only
// requires a single entry in the array above.
// cat._chip stores a back-reference to the DOM element so
// selectCat() can toggle the active class without a querySelector.
// ════════════════════════════════════════════════════════════
const catRow = document.getElementById('cat-row');
CATS.forEach(cat => {
  const chip = document.createElement('div');
  chip.className = 'cat-chip' + (cat === activeCat ? ' active' : '');
  // CSS custom property drives the chip's border/background tint
  chip.style.setProperty('--chip-color', cat.color);
  chip.innerHTML = `<span class="cat-icon">${cat.icon}</span>${cat.label}`;
  chip.addEventListener('click', () => selectCat(cat));
  cat._chip = chip; // back-reference for fast toggling
  catRow.appendChild(chip);
});

// ════════════════════════════════════════════════════════════
// SHEET DRAG
// The bottom sheet has two states: collapsed (peeking ~80px
// above the safe-area bottom) and expanded (full --sheet-h).
// The drag-handle lets users slide between them with touch.
// ════════════════════════════════════════════════════════════
const sheet = document.getElementById('sheet');
let dragStart = null; // clientY where the drag began, null when not dragging
let dragStartY = 0;   // translateY value at the moment the drag started

/**
 * Returns the translateY value (in px) that positions the sheet
 * in its collapsed (peeking) state, calculated from CSS variables
 * so it adapts to viewport height and safe-area insets.
 */
function sheetCollapsedPx() {
  const sheetH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sheet-h')) * window.innerHeight / 100;
  // parseFloat on env() returns NaN in some browsers; fall back to 0
  const safeB  = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-b')) || 0;
  return sheetH - 80 - safeB;
}

// Record the finger's starting Y and the sheet's current translateY.
document.getElementById('drag-handle').addEventListener('touchstart', e => {
  dragStart = e.touches[0].clientY;
  dragStartY = sheetExpanded ? 0 : sheetCollapsedPx();
}, {passive: true});

// While dragging, move the sheet in real-time by overriding the CSS
// transition and setting transform directly. Clamped to valid range.
document.getElementById('drag-handle').addEventListener('touchmove', e => {
  if (dragStart === null) return;
  const dy = e.touches[0].clientY - dragStart;
  const t  = Math.max(0, Math.min(sheetCollapsedPx(), dragStartY + dy));
  sheet.style.transition = 'none';
  sheet.style.transform  = `translateY(${t}px)`;
}, {passive: true});

// On release, commit the state if the drag exceeded 40 px.
// Restore CSS transition so the sheet snaps smoothly to its target.
document.getElementById('drag-handle').addEventListener('touchend', e => {
  if (dragStart === null) return;
  sheet.style.transition = '';
  const dy = e.changedTouches[0].clientY - dragStart;
  // NOTE: velocity is computed here but currently unused — the 40px
  // threshold alone handles flick gestures adequately.
  const velocity = Math.abs(dy) / (e.timeStamp - (e.timeStamp - 200)); // rough
  if (Math.abs(dy) > 40) {
    sheetExpanded = dy < 0; // dragged up → expand, dragged down → collapse
  }
  sheet.classList.toggle('expanded', sheetExpanded);
  sheet.style.transform = '';
  dragStart = null;
}, {passive: true});

// Tapping the handle (without dragging) toggles the sheet state.
document.getElementById('drag-handle').addEventListener('click', () => {
  sheetExpanded = !sheetExpanded;
  sheet.classList.toggle('expanded', sheetExpanded);
});

// ════════════════════════════════════════════════════════════
// DROP PIN
// Placing or moving a pin is the primary interaction. It always
// triggers a fresh Overpass search for the active category.
// ════════════════════════════════════════════════════════════

/**
 * Place (or move) the pin to the given coordinates.
 * Creates a draggable custom marker; dragging it calls dropPin
 * again so the search re-runs from the new position.
 * @param {number} lat
 * @param {number} lng
 */
function dropPin(lat, lng) {
  pinLat = lat; pinLng = lng;

  if (pinMarker) map.removeLayer(pinMarker);

  // Custom CSS pin shape defined in .dropped-pin / .dropped-pin::before
  const icon = L.divIcon({
    className: '',
    html: `<div style="position:relative;transform:translate(-12px,-24px)">
             <div class="dropped-pin"></div>
           </div>`,
    iconSize:   [24, 24],
    iconAnchor: [12, 24],
  });
  pinMarker = L.marker([lat, lng], { icon, draggable: true }).addTo(map);
  // Re-use dropPin on drag so the search always reflects the marker's position
  pinMarker.on('dragend', e => {
    const ll = e.target.getLatLng();
    dropPin(ll.lat, ll.lng);
  });

  document.getElementById('hint-pill').classList.add('hidden');
  document.getElementById('clear-btn').classList.add('show');

  expandSheet();
  search();
}

// ════════════════════════════════════════════════════════════
// CLEAR PIN
// Removes the pin, all POI markers, and resets the sheet to
// its initial "tap to start" state.
// ════════════════════════════════════════════════════════════

/** Remove the dropped pin and reset all derived UI state. */
function clearPin() {
  if (pinMarker) { map.removeLayer(pinMarker); pinMarker = null; }
  clearPOIs();
  pinLat = pinLng = null;
  document.getElementById('hint-pill').classList.remove('hidden');
  document.getElementById('clear-btn').classList.remove('show');
  document.getElementById('results-header').textContent = '';
  document.getElementById('results').innerHTML = `<div class="state-card"><div class="icon">📍</div><div>Tap anywhere on the map<br>to find nearby places</div></div>`;
  collapseSheet();
}

/** Remove all POI dot markers from the map and clear the places array. */
function clearPOIs() {
  poiMarkers.forEach(m => map.removeLayer(m));
  poiMarkers = [];
  currentPlaces = [];
}

// ════════════════════════════════════════════════════════════
// CATEGORY SELECT
// Swaps the active category chip and re-runs the search if a
// pin is already placed.
// ════════════════════════════════════════════════════════════

/**
 * Activate a category chip and trigger a new search.
 * @param {object} cat — entry from CATS
 */
function selectCat(cat) {
  activeCat._chip.classList.remove('active');
  activeCat = cat;
  cat._chip.classList.add('active');
  if (pinLat !== null) search();
}

// ════════════════════════════════════════════════════════════
// RADIUS
// The radius pill opens a dropdown menu. Clicking outside any
// pill closes it via a document-level click listener.
// ════════════════════════════════════════════════════════════

/**
 * Toggle the radius dropdown open/closed.
 * stopPropagation prevents the document click listener from
 * immediately closing it on the same event.
 */
function toggleRadius(e) {
  e.stopPropagation();
  document.getElementById('radius-menu').classList.toggle('open');
}

/**
 * Set the search radius, update the pill label and active option,
 * and re-run the search if a pin exists.
 * @param {number} m — radius in metres
 */
function setRadius(m) {
  radiusM = m;
  document.getElementById('radius-label').textContent = m >= 1000 ? (m / 1000) + ' km' : m + ' m';
  document.querySelectorAll('.radius-opt').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.m) === m);
  });
  document.getElementById('radius-menu').classList.remove('open');
  if (pinLat !== null) search();
}

// Close the radius dropdown whenever the user taps anywhere else on the page.
document.addEventListener('click', () => document.getElementById('radius-menu').classList.remove('open'));

// ════════════════════════════════════════════════════════════
// GPS
// The locate button pans the map to the user's position and
// stores the coordinates for use as a transport origin.
// It does NOT auto-drop a pin — the user still taps to search.
// ════════════════════════════════════════════════════════════

/**
 * Request the device's current GPS position and pan the map there.
 * Also updates userLat/userLng so the transport view can use
 * "My Location" as a route origin.
 */
function goToLocation() {
  if (!navigator.geolocation) {
    alert('Geolocation is not supported by this browser.');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      map.setView([userLat, userLng], 15);
    },
    err => {
      const msgs = {
        1: 'Location access was denied. Enable it in Settings.',
        2: 'Location unavailable right now.',
        3: 'Location request timed out.',
      };
      alert(msgs[err.code] || 'Could not get your location.');
    },
    { timeout: 10000, maximumAge: 60000 }
  );
}

// ════════════════════════════════════════════════════════════
// OVERPASS FETCH
// Overpass is the query API for OpenStreetMap data. Individual
// mirrors can be slow or down, so all three are fired in
// parallel and Promise.any() resolves on the first success.
// ════════════════════════════════════════════════════════════

/** Overpass API mirrors — raced in parallel to improve reliability. */
const OVERPASS_MIRRORS = [
  'https://overpass.kumi.systems/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
  'https://overpass-api.de/api/interpreter',
];

// AbortController for the most-recent search fetch.
// Replaced on every new search so stale requests are cancelled.
let searchAbort = null;

/**
 * Build an Overpass QL query that fetches nodes and ways with the
 * given tag within radiusM metres of the dropped pin.
 * `out center 40` limits results to 40 and returns the centroid
 * of ways (so they have a lat/lng like nodes do).
 * @param {string} tagKey
 * @param {string} tagVal
 * @returns {string}
 */
function buildQuery(tagKey, tagVal) {
  return `[out:json][timeout:15];(node["${tagKey}"="${tagVal}"](around:${radiusM},${pinLat},${pinLng});way["${tagKey}"="${tagVal}"](around:${radiusM},${pinLat},${pinLng}););out center 40;`;
}

/**
 * Send a query to all Overpass mirrors simultaneously and return
 * the first successful JSON response. Rejects with an AggregateError
 * (from Promise.any) if every mirror fails or the request is aborted.
 * @param {string} query — Overpass QL string
 * @param {AbortSignal} signal
 * @returns {Promise<object>}
 */
async function fetchOverpass(query, signal) {
  const attempts = OVERPASS_MIRRORS.map(url =>
    fetch(`${url}?data=${encodeURIComponent(query)}`, { signal, mode: 'cors' })
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(json => {
        if (!json.elements) throw new Error('No elements');
        return json;
      })
  );
  return Promise.any(attempts);
}

// ════════════════════════════════════════════════════════════
// RATINGS
// OSM does not carry user ratings. We generate deterministic
// synthetic scores seeded on each place's OSM id via a Linear
// Congruential Generator (LCG), so the same place always shows
// the same score within a session. Results are cached in
// ratingCache to avoid re-computing on every render.
// Note: the actual range produced is 3.0–5.0, not 3.5–4.8.
// ════════════════════════════════════════════════════════════

/**
 * Return a stable synthetic { score, count } for an OSM element id.
 * Uses an LCG seeded on the id — cheap, deterministic, no storage needed.
 * @param {number} osmId
 * @returns {{ score: number, count: number }}
 */
function syntheticRating(osmId) {
  if (ratingCache[osmId]) return ratingCache[osmId];
  let s = Math.abs(osmId % 1e9);
  // Standard LCG constants (Numerical Recipes)
  const rand = () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
  const score = +(3.0 + rand() * 2.0).toFixed(1); // range [3.0, 5.0]
  const count = Math.floor(rand() * 980) + 20;     // range [20, 999]
  ratingCache[osmId] = { score, count };
  return ratingCache[osmId];
}

/**
 * Render a 5-star row as HTML spans.
 * Half-stars are shown at 60% opacity; empty stars at 20%.
 * @param {number} score — value in [0, 5]
 * @param {'small'|'large'} size — selects CSS class (.star vs .detail-star)
 * @returns {string} HTML string
 */
function renderStars(score, size = 'small') {
  const cls   = size === 'large' ? 'detail-star' : 'star';
  const full  = Math.floor(score);
  const half  = score - full >= 0.5;
  const empty = 5 - full - (half ? 1 : 0);
  let html = '';
  for (let i = 0; i < full;  i++) html += `<span class="${cls}">★</span>`;
  if (half)                       html += `<span class="${cls}" style="opacity:0.6">★</span>`;
  for (let i = 0; i < empty; i++) html += `<span class="${cls}" style="opacity:0.2">★</span>`;
  return html;
}

// ════════════════════════════════════════════════════════════
// SEARCH
// Called whenever the pin moves, the category changes, or the
// radius changes. Cancels any in-flight request first, then
// fires a new Overpass query and renders results on success.
// ════════════════════════════════════════════════════════════

/**
 * Fetch nearby places for the active category around the dropped pin.
 * Results are sorted by distance and capped at 40 items.
 * An AbortError is silently swallowed (means a newer search superseded this one).
 */
async function search() {
  if (pinLat === null) return;
  clearPOIs();
  setLoading(true);

  // Cancel the previous request before starting a new one
  if (searchAbort) searchAbort.abort();
  searchAbort = new AbortController();

  const cat = activeCat;
  const [tagKey, tagVal] = Object.entries(cat.tags)[0];
  const query = buildQuery(tagKey, tagVal);

  try {
    const json = await fetchOverpass(query, searchAbort.signal);

    const places = json.elements
      .map(el => {
        // Nodes have lat/lon directly; ways return a centroid under .center
        const lat  = el.lat  ?? el.center?.lat;
        const lng  = el.lon  ?? el.center?.lon;
        // Use == null (not ===) so both null and undefined are filtered,
        // but lat/lng of exactly 0 (valid coordinate) are kept
        if (lat == null || lng == null) return null;
        const dist = haversine(pinLat, pinLng, lat, lng);
        return { ...el, lat, lng, dist };
      })
      .filter(Boolean)
      .sort((a, b) => a.dist - b.dist)
      .slice(0, 40);

    currentPlaces = places;
    renderResults(places, cat);
    renderPOIs(places, cat);
    setLoading(false);
  } catch (e) {
    // AbortError means this search was superseded by a newer one — ignore it
    if (e.name === 'AbortError') return;
    setLoading(false);
    document.getElementById('results').innerHTML = `
      <div class="state-card">
        <div class="icon">⚠️</div>
        <div>Couldn't reach OpenStreetMap.<br>Try again in a moment.</div>
        <div style="margin-top:10px">
          <button onclick="search()" style="background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer">Retry</button>
        </div>
      </div>`;
  }
}

/**
 * Show a spinner in the results list while a search is in progress.
 * Only handles the "on" case; the caller replaces the content on completion.
 * @param {boolean} on
 */
function setLoading(on) {
  if (on) {
    document.getElementById('results-header').textContent = '';
    document.getElementById('results').innerHTML = `<div class="state-card"><div class="spinner"></div><div>Searching…</div></div>`;
  }
}

// ════════════════════════════════════════════════════════════
// RENDER RESULTS
// Populates the bottom sheet list from the places array.
// All user-derived strings are passed through esc() before
// being set as innerHTML to prevent XSS.
// ════════════════════════════════════════════════════════════

/**
 * Render the list of place cards in the bottom sheet.
 * Falls back to the category label (singular) when a place has no name tag.
 * The "Directions" button calls openTransportFor with the OSM id; stopPropagation
 * prevents the click from also opening the detail panel.
 * @param {object[]} places — enriched Overpass elements (with .lat, .lng, .dist)
 * @param {object} cat — active category from CATS
 */
function renderResults(places, cat) {
  const rh = document.getElementById('results-header');
  const rl = document.getElementById('results');

  if (!places.length) {
    rh.textContent = '';
    rl.innerHTML = `<div class="state-card"><div class="icon">${cat.icon}</div><div>No ${cat.label.toLowerCase()} found within ${radiusLabel()}.</div></div>`;
    return;
  }

  rh.textContent = `${places.length} ${cat.label.toUpperCase()} NEARBY`;
  rl.innerHTML = '';

  places.forEach(p => {
    // Use street + number if available; fall back to city; fall back to empty
    const name   = p.tags?.name || cat.label.slice(0, -1);
    const sub    = p.tags?.['addr:street']
      ? (p.tags['addr:housenumber'] ? p.tags['addr:housenumber'] + ' ' : '') + p.tags['addr:street']
      : (p.tags?.['addr:city'] || '');
    const dist   = formatDist(p.dist);
    const rating = syntheticRating(p.id);

    const card = document.createElement('div');
    card.className = 'place-card';
    card.innerHTML = `
      <div class="place-icon-wrap" style="background:${cat.color}22">${cat.icon}</div>
      <div class="place-info">
        <div class="place-name">${esc(name)}</div>
        ${sub ? `<div class="place-sub">${esc(sub)}</div>` : ''}
        <div class="place-rating">
          <div class="stars" style="color:#f5c842">${renderStars(rating.score)}</div>
          <span class="rating-val">${rating.score}</span>
          <span class="rating-count">(${rating.count})</span>
        </div>
      </div>
      <div class="place-right">
        <div class="place-dist">${dist}</div>
        <button class="place-directions-btn" onclick="event.stopPropagation();openTransportFor(${p.id})">Directions</button>
      </div>
    `;
    card.addEventListener('click', () => openDetail(p, cat));
    rl.appendChild(card);
  });
}

// ════════════════════════════════════════════════════════════
// RENDER POI MARKERS
// Places a coloured emoji dot on the map for each result.
// Clicking a dot opens the same detail panel as clicking the
// card in the list.
// ════════════════════════════════════════════════════════════

/**
 * Add a dot marker to the map for each place in the results.
 * Markers are stored in poiMarkers so clearPOIs() can remove them.
 * @param {object[]} places
 * @param {object} cat
 */
function renderPOIs(places, cat) {
  places.forEach(p => {
    const icon = L.divIcon({
      className: '',
      html: `<div class="poi-dot" style="background:${cat.color};border-color:rgba(255,255,255,0.35)">${cat.icon}</div>`,
      iconSize:   [28, 28],
      iconAnchor: [14, 14],
    });
    const m = L.marker([p.lat, p.lng], { icon }).addTo(map);
    m.on('click', () => openDetail(p, cat));
    poiMarkers.push(m);
  });
}

// ════════════════════════════════════════════════════════════
// DETAIL PANEL
// A slide-up overlay showing all available OSM tags for the
// selected place. Tapping the backdrop (the semi-transparent
// overlay behind the card) closes it.
// ════════════════════════════════════════════════════════════

/**
 * Populate and open the detail overlay for a place.
 * Reads OSM tags for address, hours, phone, and website.
 * Website URLs are validated before being rendered as anchors
 * to prevent javascript: or data: href injection.
 * @param {object} place — enriched Overpass element
 * @param {object} cat — category the place belongs to
 */
function openDetail(place, cat) {
  currentDetail = { place, cat };
  const name    = place.tags?.name || cat.label.slice(0, -1);
  const phone   = place.tags?.phone || place.tags?.['contact:phone'];
  const website = place.tags?.website || place.tags?.['contact:website'];
  const hours   = place.tags?.opening_hours;
  const addr    = buildAddress(place.tags);
  const rating  = syntheticRating(place.id);

  document.getElementById('detail-icon-wrap').style.background = cat.color + '22';
  document.getElementById('detail-icon-wrap').textContent = cat.icon;
  document.getElementById('detail-icon-wrap').style.fontSize = '24px';
  document.getElementById('detail-name').textContent = name;
  document.getElementById('detail-cat').textContent  = cat.label;
  document.getElementById('detail-cat').style.color  = cat.color;

  document.getElementById('detail-rating-block').innerHTML = `
    <div class="detail-rating-score">${rating.score}</div>
    <div class="detail-rating-right">
      <div class="detail-stars-row" style="color:#f5c842">${renderStars(rating.score, 'large')}</div>
      <div class="detail-rating-count">${rating.count} ratings</div>
    </div>
  `;

  let rows = '';
  if (addr)    rows += detailRow('📍', esc(addr));
  if (hours)   rows += detailRow('🕐', esc(hours));
  if (phone)   rows += detailRow('📞', `<a href="tel:${esc(phone)}">${esc(phone)}</a>`);
  if (website) {
    // Only render as a clickable link when the scheme is http(s).
    // OSM data occasionally contains bare domains or malformed URLs.
    const safeUrl = /^https?:\/\//i.test(website) ? website : null;
    if (safeUrl) {
      rows += detailRow('🌐', `<a href="${esc(safeUrl)}" target="_blank" rel="noopener noreferrer">${esc(safeUrl.replace(/^https?:\/\//i, ''))}</a>`);
    } else {
      rows += detailRow('🌐', esc(website));
    }
  }
  if (!rows) rows = detailRow('ℹ️', 'No additional details available.');

  document.getElementById('detail-rows').innerHTML = rows;

  // Vibe description and comments
  const vibeEl = document.getElementById('detail-vibe');
  vibeEl.textContent = buildVibeDescription(place, cat, rating);

  renderComments(place.id);

  document.getElementById('detail').classList.add('open');
}

/**
 * Build a single detail row with an icon and arbitrary HTML content.
 * Icon is an emoji (trusted) and content must already be escaped by the caller.
 * @param {string} icon — emoji character
 * @param {string} content — already-escaped HTML string
 * @returns {string}
 */
function detailRow(icon, content) {
  return `<div class="detail-row"><span class="row-icon">${icon}</span><span>${content}</span></div>`;
}

/**
 * Close the detail panel when the user taps the backdrop.
 * Checks that the click target is the overlay itself, not the card inside it.
 */
function closeDetail(e) {
  if (e.target === document.getElementById('detail')) {
    document.getElementById('detail').classList.remove('open');
  }
}

/**
 * Open the current place in Apple Maps (iOS) or Google Maps (other).
 * Uses lat/lng for the query so it works even when the place has no name.
 */
function openInMaps() {
  if (!currentDetail) return;
  const { place } = currentDetail;
  const name = encodeURIComponent(place.tags?.name || '');
  const ll   = `${place.lat},${place.lng}`;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (isIOS) {
    window.open(`https://maps.apple.com/?q=${name}&ll=${ll}`, '_blank');
  } else {
    window.open(`https://www.google.com/maps/search/?api=1&query=${ll}`, '_blank');
  }
}

/** Close the detail panel and switch to the transport view for the same place. */
function openTransportForDetail() {
  if (!currentDetail) return;
  const { place, cat } = currentDetail;
  document.getElementById('detail').classList.remove('open');
  openTransportFor(place.id);
}

/**
 * Set the transport destination to a place from currentPlaces by OSM id
 * and switch to the transport view.
 * @param {number} osmId
 */
function openTransportFor(osmId) {
  const place = currentPlaces.find(p => p.id === osmId);
  if (!place) return;
  const name = place.tags?.name || activeCat.label.slice(0, -1);
  transportDest = { lat: place.lat, lng: place.lng, name };
  document.getElementById('transport-dest-name').textContent = name;
  renderTransport();
  showTransportView();
}

// ════════════════════════════════════════════════════════════
// TRANSPORT VIEW
// Shows estimated travel time cards for walk / cycle / drive /
// transit / fly between an origin and the selected destination.
// Times are formula-based estimates — not real routing data.
// Deep-link buttons hand off to Apple Maps / Google Maps / Skyscanner.
// ════════════════════════════════════════════════════════════

/**
 * Switch the origin chip selection and re-render transport cards.
 * @param {'gps'|'pin'} mode
 */
function selectOrigin(mode) {
  transportOriginMode = mode;
  document.querySelectorAll('.origin-chip').forEach(c =>
    c.classList.toggle('active', c.dataset.origin === mode)
  );
  renderTransport();
}

/**
 * Switch the active transport mode tab and re-render.
 * @param {'all'|'walk'|'cycle'|'drive'|'transit'|'fly'} mode
 */
function selectMode(mode) {
  transportActiveMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.mode === mode)
  );
  renderTransport();
}

/**
 * Resolve the current origin to { lat, lng, name } based on the
 * selected origin mode. Returns null if the required data isn't
 * available yet (GPS not acquired, or no pin dropped).
 * @returns {{ lat: number, lng: number, name: string } | null}
 */
function getOriginCoords() {
  if (transportOriginMode === 'gps' && userLat !== null) {
    return { lat: userLat, lng: userLng, name: 'My Location' };
  }
  if (transportOriginMode === 'pin' && pinLat !== null) {
    return { lat: pinLat, lng: pinLng, name: 'Dropped Pin' };
  }
  return null; // GPS not yet acquired, or no pin dropped
}

/**
 * Build and display all transport cards for the current origin/destination pair.
 * Handles three loading states before rendering cards:
 *   1. No destination set yet
 *   2. GPS origin selected but position not yet acquired (triggers geolocation)
 *   3. Pin origin selected but no pin has been dropped
 *
 * In "all" mode, the ground mode with the shortest time is labelled "Best".
 * The flight card is always appended last when the fly tab is visible.
 */
function renderTransport() {
  const origin = getOriginCoords();
  const dest   = transportDest;
  const cards  = document.getElementById('transport-cards');

  if (!dest) {
    cards.innerHTML = `<div class="transport-state"><div class="icon">📌</div><div>No destination selected.<br>Tap a place on the map first.</div></div>`;
    return;
  }

  if (!origin) {
    if (transportOriginMode === 'gps') {
      // Show spinner and attempt to acquire GPS. On success, re-render.
      cards.innerHTML = `<div class="transport-state"><div class="spinner"></div><div>Getting your location…</div></div>`;
      navigator.geolocation?.getCurrentPosition(
        pos => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          document.getElementById('transport-origin-name').textContent = 'My Location';
          renderTransport();
        },
        () => {
          cards.innerHTML = `<div class="transport-state"><div class="icon">📍</div><div>Couldn't get your location.<br>Try "Dropped Pin" instead.</div></div>`;
        },
        { timeout: 8000 }
      );
      return;
    }
    if (transportOriginMode === 'pin') {
      cards.innerHTML = `<div class="transport-state"><div class="icon">📌</div><div>Drop a pin on the map first,<br>then come back here.</div></div>`;
      return;
    }
    return;
  }

  document.getElementById('transport-origin-name').textContent = origin.name;

  const distM    = haversine(origin.lat, origin.lng, dest.lat, dest.lng);
  const allModes = buildTransportModes(distM, origin, dest);
  const flight   = buildFlightCard(origin, dest);

  const showFly  = transportActiveMode === 'all' || transportActiveMode === 'fly';
  // "fly" tab shows only the flight card; other single-mode tabs filter allModes
  const filtered = transportActiveMode === 'all'
    ? allModes
    : transportActiveMode === 'fly'
      ? []
      : allModes.filter(m => m.id === transportActiveMode);

  if (!filtered.length && !showFly) {
    cards.innerHTML = `<div class="transport-state"><div class="icon">🚫</div><div>No options available for this route.</div></div>`;
    return;
  }

  // The ground mode with the lowest minute count gets the "Best" badge
  const bestId = allModes.reduce((a, b) => a.minutes < b.minutes ? a : b).id;

  cards.innerHTML = '';
  filtered.forEach(mode => {
    cards.appendChild(buildTransportCard(mode, mode.id === bestId && transportActiveMode === 'all'));
  });

  if (showFly) {
    if (flight) {
      cards.appendChild(flight.card);
    } else {
      const msg = document.createElement('div');
      msg.className = 'transport-state';
      msg.innerHTML = `<div class="icon">✈️</div><div>The origin and destination appear to be at the same airport, or no nearby airports found.</div>`;
      cards.appendChild(msg);
    }
  }
}

/**
 * Compute estimated travel times for all ground modes between origin and dest.
 * Speeds are rough approximations; driving includes a parking buffer.
 * Returns an array of mode objects consumed by buildTransportCard().
 *
 * @param {number} distM — straight-line distance in metres (haversine)
 * @param {{ lat, lng, name }} origin
 * @param {{ lat, lng, name }} dest
 * @returns {object[]}
 */
function buildTransportModes(distM, origin, dest) {
  const km = distM / 1000;

  const walkMin    = Math.round((km / 5) * 60);   // 5 km/h average walking pace
  const cycleMin   = Math.round((km / 15) * 60);  // 15 km/h average cycling pace
  // Driving speed scales with distance: urban (<2 km) → 25 km/h, suburban → 40, highway → 65
  const driveSpeedKmh = km < 2 ? 25 : km < 10 ? 40 : 65;
  const driveMin   = Math.round((km / driveSpeedKmh) * 60) + (km < 5 ? 3 : 5); // +parking buffer
  const transitMin = Math.round((km / 25) * 60) + 8; // 25 km/h avg speed + 8 min wait

  const modes = [
    {
      id: 'walk',
      icon: '🚶',
      label: 'Walking',
      minutes: walkMin,
      color: '#4CAF50',
      sub: `${formatDist(distM)} on foot`,
      steps: buildWalkSteps(distM, origin, dest),
      appUrl: buildMapsUrl(origin, dest, 'walk'),
      appLabel: isIOS() ? 'Open in Maps' : 'Open in Google Maps',
    },
    {
      id: 'cycle',
      icon: '🚲',
      label: 'Cycling',
      minutes: cycleMin,
      color: '#FF9800',
      sub: `${formatDist(distM)} by bike`,
      steps: buildCycleSteps(distM, origin, dest),
      appUrl: buildMapsUrl(origin, dest, 'cycle'),
      appLabel: isIOS() ? 'Open in Maps' : 'Open in Google Maps',
    },
    {
      id: 'drive',
      icon: '🚗',
      label: 'Driving',
      minutes: driveMin,
      color: '#2196F3',
      sub: `${formatDist(distM)} · includes parking`,
      steps: buildDriveSteps(distM, origin, dest),
      appUrl: buildMapsUrl(origin, dest, 'drive'),
      appLabel: isIOS() ? 'Open in Maps' : 'Open in Google Maps',
    },
    {
      id: 'transit',
      icon: '🚌',
      label: 'Public Transit',
      minutes: transitMin,
      color: '#9C27B0',
      sub: `~${Math.round(km)} km · includes 8 min wait`,
      steps: buildTransitSteps(distM, origin, dest),
      appUrl: buildMapsUrl(origin, dest, 'transit'),
      appLabel: isIOS() ? 'Open in Transit / Maps' : 'Open in Google Maps',
    },
  ];

  return modes;
}

/**
 * Build a transport card DOM element for one mode.
 * The distance bar fill is animated via requestAnimationFrame after the
 * element is inserted — setting width immediately would skip the transition.
 * Bar percentage is inverse of time: faster = fuller bar (capped at 100%).
 *
 * @param {object} mode — entry from buildTransportModes()
 * @param {boolean} isBest — whether to show the "Best" badge
 * @returns {HTMLElement}
 */
function buildTransportCard(mode, isBest) {
  const wrap = document.createElement('div');
  wrap.className = 'transport-card' + (isBest ? ' best' : '');

  // Format time as "45" (min) or "1h 20" (hours + leftover minutes)
  const timeStr = mode.minutes < 60
    ? `${mode.minutes}`
    : `${Math.floor(mode.minutes / 60)}h ${mode.minutes % 60}`;
  const unit = mode.minutes < 60 ? 'min' : '';

  wrap.innerHTML = `
    <div class="transport-card-header">
      <div class="transport-mode-icon" style="background:${mode.color}22">${mode.icon}</div>
      <div class="transport-card-info">
        <div class="transport-card-title">
          ${esc(mode.label)}
          ${isBest ? '<span class="best-badge">Best</span>' : ''}
        </div>
        <div class="transport-card-sub">${esc(mode.sub)}</div>
      </div>
      <div class="transport-card-time">
        <div class="transport-time-val" style="color:${mode.color}">${timeStr}</div>
        <div class="transport-time-unit">${unit}</div>
      </div>
    </div>
    <div class="dist-bar">
      <div class="dist-bar-fill" style="background:${mode.color};width:0%" data-pct="${Math.min(100, Math.round(100 - (mode.minutes / 120) * 100))}%"></div>
    </div>
    <div class="transport-steps">
      ${mode.steps.map(s => `
        <div class="transport-step">
          <div class="step-icon">${s.icon}</div>
          <div class="step-text">${s.text}</div>
          ${s.dist ? `<div class="step-dist">${s.dist}</div>` : ''}
        </div>
      `).join('')}
    </div>
    <button class="transport-open-btn" onclick="window.open('${mode.appUrl}','_blank')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      ${esc(mode.appLabel)}
    </button>
  `;

  // Defer width update so the CSS transition runs after the element is painted
  requestAnimationFrame(() => {
    const fill = wrap.querySelector('.dist-bar-fill');
    if (fill) fill.style.width = fill.dataset.pct;
  });

  return wrap;
}

// ── Step generators ──────────────────────────────────────────
// These produce plausible-looking turn-by-turn steps based purely
// on distance thresholds. They are illustrative, not real routing.
// The "Open in Maps" button at the bottom of each card provides
// actual navigation.

/**
 * Generate simplified walking step descriptions.
 * Extra intermediate steps are added for longer distances.
 */
function buildWalkSteps(distM, origin, dest) {
  const steps = [];
  steps.push({ icon: '🚶', text: `Head towards <strong>${esc(dest.name)}</strong>`, dist: formatDist(distM * 0.4) });
  if (distM > 400) steps.push({ icon: '↗️', text: 'Continue on main street', dist: formatDist(distM * 0.4) });
  if (distM > 800) steps.push({ icon: '↪️', text: 'Turn and follow the path', dist: formatDist(distM * 0.2) });
  steps.push({ icon: '📍', text: `Arrive at <strong>${esc(dest.name)}</strong>`, dist: '' });
  return steps;
}

/** Generate simplified cycling step descriptions. */
function buildCycleSteps(distM, origin, dest) {
  const steps = [];
  steps.push({ icon: '🚲', text: `Cycle towards <strong>${esc(dest.name)}</strong>`, dist: formatDist(distM * 0.5) });
  if (distM > 500) steps.push({ icon: '↗️', text: 'Follow the bike lane or road', dist: formatDist(distM * 0.4) });
  steps.push({ icon: '🅿️', text: 'Lock your bike nearby', dist: '' });
  steps.push({ icon: '📍', text: `Arrive at <strong>${esc(dest.name)}</strong>`, dist: '' });
  return steps;
}

/** Generate simplified driving step descriptions. */
function buildDriveSteps(distM, origin, dest) {
  const steps = [];
  steps.push({ icon: '🚗', text: 'Head out on the main road', dist: formatDist(distM * 0.3) });
  if (distM > 1000) steps.push({ icon: '🛣️', text: 'Merge onto a larger road', dist: formatDist(distM * 0.5) });
  steps.push({ icon: '↪️', text: `Turn towards <strong>${esc(dest.name)}</strong>`, dist: formatDist(distM * 0.15) });
  steps.push({ icon: '🅿️', text: 'Find parking nearby', dist: '' });
  steps.push({ icon: '📍', text: `Arrive at <strong>${esc(dest.name)}</strong>`, dist: '' });
  return steps;
}

/** Generate simplified public transit step descriptions. */
function buildTransitSteps(distM, origin, dest) {
  const steps = [];
  // Cap the walk-to-stop distance at 400 m regardless of total distance
  steps.push({ icon: '🚶', text: 'Walk to the nearest stop', dist: formatDist(Math.min(400, distM * 0.15)) });
  steps.push({ icon: '⏱️', text: 'Wait ~8 min for the next service', dist: '' });
  steps.push({ icon: '🚌', text: `Ride towards <strong>${esc(dest.name)}</strong>`, dist: formatDist(distM * 0.7) });
  if (distM > 2000) steps.push({ icon: '🔄', text: 'Transfer at interchange if needed', dist: '' });
  steps.push({ icon: '🚶', text: `Walk to <strong>${esc(dest.name)}</strong>`, dist: formatDist(Math.min(350, distM * 0.15)) });
  steps.push({ icon: '📍', text: 'Arrive at destination', dist: '' });
  return steps;
}

/**
 * Find the closest airport in AIRPORTS to the given coordinates.
 * @param {number} lat
 * @param {number} lng
 * @param {string|null} excludeIata — skip this IATA code (used to ensure dep ≠ arr)
 * @returns {{ airport: object, distM: number }}
 */
function nearestAirport(lat, lng, excludeIata = null) {
  let best = null, bestDist = Infinity;
  for (const ap of AIRPORTS) {
    if (excludeIata && ap.iata === excludeIata) continue;
    const d = haversine(lat, lng, ap.lat, ap.lng);
    if (d < bestDist) { bestDist = d; best = ap; }
  }
  return { airport: best, distM: bestDist };
}

/**
 * Generate a deterministic synthetic economy ticket price for an airport pair.
 * Seeded on the IATA character codes + current month so the value refreshes
 * monthly but stays stable within a session.
 * Range: $89–$899 (not distance-weighted — a known simplification).
 * @param {string} depIata
 * @param {string} arrIata
 * @returns {number} price in USD
 */
function syntheticFlightPrice(depIata, arrIata) {
  const seed = depIata.split('').reduce((a,c) => a + c.charCodeAt(0), 0)
             + arrIata.split('').reduce((a,c) => a + c.charCodeAt(0), 0)
             + new Date().getMonth();
  let s = seed * 1664525 + 1013904223;
  const rand = () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
  return Math.round(89 + rand() * 810);
}

/**
 * Estimate flight duration from airport-to-airport great-circle distance.
 * Assumes 850 km/h cruise speed + 30 min fixed overhead (taxi, climb, descent).
 * @param {number} distM — airport-to-airport distance in metres
 * @returns {number} duration in minutes
 */
function flightDurationMin(distM) {
  const km = distM / 1000;
  return Math.round((km / 850) * 60) + 30;
}

/**
 * Build the flight card DOM element for the transport view.
 * Returns null when flying makes no sense (same departure and arrival airport).
 * Door-to-door time includes: transfer to dep airport (40 km/h avg) +
 * 2h check-in buffer + flight time + transfer from arr airport.
 *
 * @param {{ lat, lng, name }} origin
 * @param {{ lat, lng, name }} dest
 * @returns {{ card: HTMLElement, minutes: number } | null}
 */
function buildFlightCard(origin, dest) {
  const { airport: depAp, distM: depDistM } = nearestAirport(origin.lat, origin.lng);
  // Exclude the departure airport from the arrival search so dep ≠ arr
  const { airport: arrAp, distM: arrDistM } = nearestAirport(dest.lat, dest.lng, depAp.iata);

  if (!depAp || !arrAp) return null;
  if (depAp.iata === arrAp.iata) return null; // same airport — flight irrelevant

  const flightDistM = haversine(depAp.lat, depAp.lng, arrAp.lat, arrAp.lng);
  const price       = syntheticFlightPrice(depAp.iata, arrAp.iata);
  const durMin      = flightDurationMin(flightDistM);

  const wrap = document.createElement('div');
  wrap.className = 'transport-card';

  wrap.innerHTML = `

    <div class="dist-bar">

    </div>
    <div class="flight-airports">
      <div class="flight-airport-row">
        <div class="airport-role dep">DEP</div>
        <div class="airport-iata">${depAp.iata}</div>
        <div class="airport-info">
          <div class="airport-name">${esc(depAp.name)}</div>

          <div class="flight-price-label">transfer</div>
          <div style="font-size:13px;font-weight:600;color:var(--muted)">${Math.round(depDistM/1000/40*60)}m drive</div>
        </div>

        <div class="airport-iata">${arrAp.iata}</div>
        <div class="airport-info">

        </div>
      </div>

    <div class="flight-book-btns">
      <button class="flight-book-btn btn-skyscanner" onclick="window.open('${skyscannerUrl}','_blank')">

// ── Deep links ──────────────────────────────────────────────

/**
 * Build a maps deep-link URL for the given origin → dest route and transport mode.
 * On iOS, opens Apple Maps; on all other platforms, opens Google Maps.
 * Apple Maps dirflg codes: w=walk, b=bicycle, d=drive, r=transit.
 * @param {{ lat, lng }} origin
 * @param {{ lat, lng }} dest
 * @param {'walk'|'cycle'|'drive'|'transit'} mode
 * @returns {string} URL
 */
function buildMapsUrl(origin, dest, mode) {
  if (isIOS()) {
    const modeMap = { walk: 'w', cycle: 'b', drive: 'd', transit: 'r' };
    const dir = modeMap[mode] || 'd';
    return `https://maps.apple.com/?saddr=${origin.lat},${origin.lng}&daddr=${dest.lat},${dest.lng}&dirflg=${dir}`;
  } else {
    const modeMap = { walk: 'walking', cycle: 'bicycling', drive: 'driving', transit: 'transit' };
    const travelMode = modeMap[mode] || 'driving';
    return `https://www.google.com/maps/dir/?api=1&origin=${origin.lat},${origin.lng}&destination=${dest.lat},${dest.lng}&travelmode=${travelMode}`;
  }
}

/**
 * Detect iOS. The MSStream check excludes IE11 on Windows Phone,
 * which also matched the iPad/iPhone/iPod pattern.
 * @returns {boolean}
 */
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

// ════════════════════════════════════════════════════════════
// VIBE DESCRIPTION
// Generates a short natural-language summary of a place from
// its OSM tags. Falls back to generic phrases when tags are
// sparse (common for OSM data). Category-specific phrasing
// is driven by the cat.id so the text reads naturally for
// restaurants, cafés, hotels, etc.
// ════════════════════════════════════════════════════════════

/**
 * Build a 1–3 sentence "what's it like?" blurb from OSM tags.
 * The result is plain text (safe to set as textContent).
 * @param {object} place — enriched Overpass element
 * @param {object} cat — active category from CATS
 * @param {{ score: number, count: number }} rating
 * @returns {string}
 */
function buildVibeDescription(place, cat, rating) {
  const tags = place.tags || {};

  // ── Shared tag reads ──────────────────────────────────────
  const name      = tags.name || cat.label.slice(0, -1);
  const cuisine   = tags.cuisine?.replace(/_/g, ' ');
  const diet      = tags['diet:vegan'] === 'yes' ? 'vegan' : tags['diet:vegetarian'] === 'yes' ? 'vegetarian' : null;
  const priceTag  = tags['price_level'] || tags['charge'];
  const outdoor   = tags['outdoor_seating'] === 'yes';
  const takeaway  = tags['takeaway'] === 'yes' || tags['takeaway'] === 'only';
  const wifi      = tags['internet_access'] === 'wlan' || tags['wifi'] === 'yes';
  const stars     = tags['stars']; // hotel star rating
  const rooms     = tags['rooms'];
  const capacity  = tags['capacity'];
  const drinkType = tags['drink:beer'] === 'yes' ? 'craft beers' : tags['drink:cocktails'] === 'yes' ? 'cocktails' : null;
  const sport     = tags['sport'];
  const hours     = tags['opening_hours'];
  const openNow   = isOpenNow(hours);

  // ── Vibe adjective from synthetic rating ─────────────────
  const vibeWord = rating.score >= 4.5 ? 'highly rated'
                 : rating.score >= 4.0 ? 'well-regarded'
                 : rating.score >= 3.5 ? 'solid'
                 : 'modestly rated';

  const sentences = [];

  // ── Category-specific opening sentence ───────────────────
  if (cat.id === 'restaurant') {
    let s = `A ${vibeWord} restaurant`;
    if (cuisine) s += ` specialising in ${cuisine}`;
    if (diet)    s += `, with ${diet} options`;
    s += '.';
    sentences.push(s);
    if (outdoor) sentences.push('Outdoor seating is available.');
    if (takeaway) sentences.push('Takeaway orders are welcome.');

  } else if (cat.id === 'cafe') {
    let s = `A ${vibeWord} café`;
    if (cuisine) s += ` with a focus on ${cuisine}`;
    s += '.';
    sentences.push(s);
    if (wifi)    sentences.push('Free Wi-Fi on offer — great for working.');
    if (outdoor) sentences.push('Grab a seat outside when the weather's nice.');

  } else if (cat.id === 'bar') {
    let s = `A ${vibeWord} bar`;
    if (drinkType) s += ` known for its ${drinkType}`;
    s += '.';
    sentences.push(s);
    if (outdoor) sentences.push('Outdoor seating available.');

  } else if (cat.id === 'fast_food') {
    sentences.push(`A ${vibeWord} quick-service spot${cuisine ? ' serving ' + cuisine : ''}.`);
    if (takeaway) sentences.push('Takeaway-friendly.');

  } else if (cat.id === 'hotel') {
    let s = `A ${vibeWord} hotel`;
    if (stars)   s += ` (${stars}-star)`;
    if (rooms)   s += ` with ${rooms} rooms`;
    s += '.';
    sentences.push(s);

  } else if (cat.id === 'gym') {
    let s = `A ${vibeWord} fitness centre`;
    if (sport)   s += ` offering ${sport.replace(/_/g, ' ')}`;
    if (capacity) s += ` with capacity for ${capacity}`;
    s += '.';
    sentences.push(s);

  } else if (cat.id === 'park') {
    sentences.push(`A ${vibeWord} green space — ideal for a stroll or some fresh air.`);

  } else if (cat.id === 'museum') {
    sentences.push(`A ${vibeWord} museum worth a visit.`);

  } else {
    sentences.push(`A ${vibeWord} ${cat.label.slice(0, -1).toLowerCase()}.`);
  }

  // ── Generic supplementary sentences ──────────────────────
  if (priceTag) {
    sentences.push(`Pricing: ${priceTag}.`);
  }

  if (openNow === true)  sentences.push('Currently open.');
  if (openNow === false) sentences.push('Currently closed — check hours before visiting.');

  if (sentences.length < 2) {
    // Pad with a rating-quality sentence when we have little else to say
    sentences.push(`Rated ${rating.score} by ${rating.count} visitors.`);
  }

  return sentences.join(' ');
}

/**
 * Determine whether the place is currently open given an OSM opening_hours string.
 * Returns true (open), false (closed), or null (can't determine).
 * Only handles the simple "Mo-Su HH:MM-HH:MM" pattern — a full parser is out of scope.
 * @param {string|undefined} hoursStr
 * @returns {boolean|null}
 */
function isOpenNow(hoursStr) {
  if (!hoursStr) return null;
  if (hoursStr.trim() === '24/7') return true;
  // Extract first HH:MM-HH:MM time range
  const m = hoursStr.match(/(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})/);
  if (!m) return null;
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const openMin  = parseInt(m[1]) * 60 + parseInt(m[2]);
  const closeMin = parseInt(m[3]) * 60 + parseInt(m[4]);
  // Handle overnight spans (e.g. 22:00-02:00)
  if (closeMin < openMin) return nowMin >= openMin || nowMin < closeMin;
  return nowMin >= openMin && nowMin < closeMin;
}

// ════════════════════════════════════════════════════════════
// COMMENTS
// User comments are stored in localStorage keyed by OSM id.
// Each entry is an array of { author, text, ts } objects.
// "You" is the hardcoded author name for this single-user app.
// ════════════════════════════════════════════════════════════

const COMMENTS_KEY = 'pindrop_comments';

/** Load the full comments map from localStorage. */
function loadAllComments() {
  try { return JSON.parse(localStorage.getItem(COMMENTS_KEY) || '{}'); }
  catch { return {}; }
}

/**
 * Get the comment list for one place.
 * @param {number} osmId
 * @returns {Array<{author:string, text:string, ts:number}>}
 */
function getComments(osmId) {
  return loadAllComments()[osmId] || [];
}

/**
 * Persist a new comment for a place.
 * @param {number} osmId
 * @param {string} text
 */
function addComment(osmId, text) {
  const all = loadAllComments();
  if (!all[osmId]) all[osmId] = [];
  all[osmId].push({ author: 'You', text: text.trim(), ts: Date.now() });
  localStorage.setItem(COMMENTS_KEY, JSON.stringify(all));
}

/**
 * Delete a comment by its index within the place's comment list.
 * @param {number} osmId
 * @param {number} idx
 */
function deleteComment(osmId, idx) {
  const all = loadAllComments();
  if (!all[osmId]) return;
  all[osmId].splice(idx, 1);
  localStorage.setItem(COMMENTS_KEY, JSON.stringify(all));
}

/**
 * Render the comments section (list + add-comment form) into #detail-comments.
 * Called once on detail open and again after each add/delete action.
 * @param {number} osmId
 */
function renderComments(osmId) {
  const container = document.getElementById('detail-comments');
  const comments  = getComments(osmId);

  let listHtml = '';
  if (comments.length === 0) {
    listHtml = `<div class="no-comments-msg">No comments yet. Be the first!</div>`;
  } else {
    comments.forEach((c, i) => {
      const date = new Date(c.ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      listHtml += `
        <div class="comment-item">
          <div class="comment-meta">
            <span class="comment-author">${esc(c.author)}</span>
            <span style="display:flex;align-items:center;gap:6px">
              <span class="comment-date">${date}</span>
              <button class="comment-delete-btn" onclick="handleDeleteComment(${osmId},${i})">✕</button>
            </span>
          </div>
          <div class="comment-text">${esc(c.text)}</div>
        </div>`;
    });
  }

  container.innerHTML = `
    <div class="comments-heading">Comments</div>
    ${listHtml}
    <div class="comment-form">
      <textarea class="comment-input" id="comment-input-${osmId}" placeholder="Share your experience…" rows="3"></textarea>
      <button class="comment-submit-btn" onclick="handleAddComment(${osmId})">Post</button>
    </div>
  `;
}

/**
 * Handle the "Post" button click: validate, save, and re-render comments.
 * @param {number} osmId
 */
function handleAddComment(osmId) {
  const input = document.getElementById(`comment-input-${osmId}`);
  if (!input) return;
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  addComment(osmId, text);
  renderComments(osmId);
}

/**
 * Handle the delete (✕) button on a comment.
 * @param {number} osmId
 * @param {number} idx
 */
function handleDeleteComment(osmId, idx) {
  deleteComment(osmId, idx);
  renderComments(osmId);
}

/**
 * Haversine great-circle distance between two lat/lng points.
 * Returns metres. Accurate to ~0.5% for distances up to a few thousand km.
 * @param {number} lat1
 * @param {number} lng1
 * @param {number} lat2
 * @param {number} lng2
 * @returns {number} distance in metres
 */
function haversine(lat1, lng1, lat2, lng2) {
  const R    = 6371000; // Earth radius in metres
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a    = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

/**
 * Format a distance in metres as a human-readable string.
 * Values under 1 km are shown in whole metres; 1 km and above use one decimal.
 * @param {number} m
 * @returns {string} e.g. "350 m" or "1.4 km"
 */
function formatDist(m) {
  return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km';
}

/**
 * Format the current radiusM value for display in the UI.
 * @returns {string} e.g. "500 m" or "2 km"
 */
function radiusLabel() {
  return radiusM >= 1000 ? (radiusM / 1000) + ' km' : radiusM + ' m';
}

/**
 * Assemble a readable address string from OSM addr:* tags.
 * Returns an empty string when no address tags are present.
 * @param {object|undefined} tags — OSM element tags object
 * @returns {string}
 */
function buildAddress(tags) {
  if (!tags) return '';
  const parts = [
    tags['addr:housenumber'] && tags['addr:street'] ? tags['addr:housenumber'] + ' ' + tags['addr:street'] : tags['addr:street'],
    tags['addr:city'],
  ].filter(Boolean);
  return parts.join(', ');
}

/**
 * Escape a string for safe insertion into HTML.
 * Replaces the five characters that can break out of HTML contexts.
 * Used on all user-derived / OSM-derived strings before innerHTML insertion.
 * @param {*} s — value to escape (coerced to string)
 * @returns {string}
 */
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ════════════════════════════════════════════════════════════
// INIT — auto-locate on load
// Silently attempt to acquire GPS on page load so that
// userLat/userLng are available immediately when the user
// opens the transport view. The map pans to the user's position
// as a convenience; the user still needs to tap to drop a pin.
// ════════════════════════════════════════════════════════════
navigator.geolocation?.getCurrentPosition(pos => {
  userLat = pos.coords.latitude;
  userLng = pos.coords.longitude;
  map.setView([userLat, userLng], 15);
}, null, { timeout: 10000, maximumAge: 60000 });
